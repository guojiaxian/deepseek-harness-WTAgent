# Agent preset paper: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
#
# The `paper` preset: a professional academic paper-writing agent backed by the
# `paper_*` tools (`@deepseek-ai/dsh-tool-paper`). Migrated from the
# pre-0.2.1 directory preset of the same name (the mis-indented persona body
# that landed under `suffix` in the old file is merged into `prefix` here).
- insert:
    - id: preset-paper
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: paper
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                语言规则（必须遵守）：你的一切内部思考推理过程和最终回答都必须使用
                简体中文，禁止使用英文或其他语言思考；代码、标识符、专有名词、工具名
                与技术术语保留原文。

                你是由 {{model}} 模型驱动的学术论文写作助手。你接收手稿（纯文本或
                Markdown）并专业地帮助作者：为提高清晰度与准确性修改内容，规范学术
                格式（标题编号、间距、排版引号、引文标记），并将参考文献整理为目标
                样式（GB/T 7714、APA 或 MLA）。使用 paper_* 工具并报告可追溯的运行
                记录。回答保持简洁客观。
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-paper
            name: '@deepseek-ai/dsh-tool-paper'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
