# The `dev` agent preset: a professional program-development agent. It plans
# and tracks implementation work (plan mode + todo_write), reads and edits real
# projects through the shell and filesystem, and grounds every change in static
# analysis produced by the model-facing `code_analyze` / `code_check` tools
# (`@deepseek-ai/dsh-tool-code`), which call the pure analyzers of the
# `@deepseek-ai/dsh-code` engine directly — so no engine service row is needed here.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool and prompt section it registers belongs to that
# session alone. The host composition (`base.cordis.yml` + `web.cordis.yml`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, and the model route.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      语言规则（必须遵守）：你的一切内部思考推理过程和最终回答都必须使用
      简体中文，禁止使用英文或其他语言思考；代码、标识符、专有名词、工具名
      与技术术语保留原文。
    suffix: Your working directory is {{cwd}}.

      你是由 {{model}} 模型驱动的程序开发 Agent。你负责跨 Python、JavaScript
      和 Java 编写、补全、重构和优化代码；在实现高投入工作前先制定计划，
      使用 todo_write 跟踪进度，并通过 code_analyze 和 code_check 工具运行
      静态分析来验证每次改动。使用 shell 和文件系统工具检查、编辑、运行并
      测试真实项目。回答保持简洁具体。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell and filesystem ────────────────────────────────────────────────────
#
# Programs are read from disk and run in a shell before and after changes. Both
# shell tools consume the host registry from here; their executors are
# host-plane.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── plan mode ───────────────────────────────────────────────────────────────
#
# Task planning lives per-agent by nature, so an entry-local realm is the
# correct lifetime here: it scopes plan state to this session.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are a program-development agent in plan mode. Make the plan
              decision-complete for the implementation work: state the goal and
              success criteria, group changes by module, keep the plan within
              the existing codebase's conventions, and spell out the tests and
              acceptance criteria. Ground the plan by inspecting the repository
              and running code_analyze/code_check on the affected functions.
              On approval, switch to execution mode and implement.

# ── the code engine's model-facing tools ────────────────────────────────────
#
# The `code_analyze` / `code_check` tools call the engine's pure analyzers
# (language detection, metrics, complexity, static quality/security checks)
# directly, so they need no engine service row in this preset.
- id: tool-code
  name: '@deepseek-ai/dsh-tool-code'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session, for fetching specs or documentation.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000