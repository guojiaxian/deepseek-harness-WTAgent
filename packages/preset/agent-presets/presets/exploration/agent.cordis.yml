# The `exploration` agent preset: a professional exploration data processing
# agent. It ingests raw exploration records (geology, geophysics, or well-log
# data in CSV, JSON, or SEG-Y), cleans and converts the dataset, extracts
# statistics, detects anomalies, and renders seismic section profiles (PNG/SVG), then reports the traceability run record.
# The engine's pure processors are surfaced through the model-facing
# `exploration_*` tools (`@deepseek-ai/dsh-tool-exploration`), which take an
# inline pipeline, so no engine service row is needed here.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool and prompt section it registers belongs to that
# session alone. The host composition (`base.cordis.yml` + `web.cordis.yml`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, and the model route.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      语言规则（必须遵守）：你的一切内部思考推理过程和最终回答都必须使用
      简体中文，禁止使用英文或其他语言思考；代码、标识符、专有名词、工具名
      与技术术语保留原文。
    suffix: Your working directory is {{cwd}}.

      你是由 {{model}} 模型驱动的勘探数据处理 Agent。你接收原始勘探数据
      （CSV、JSON 或 SEG-Y 格式的地质、地球物理或测井记录）并专业地处理：
      解析输入、清洗数据、进行单位或深度/时间换算、提取统计量、检测异常，
      并在数据为地震数据时渲染地震剖面。使用 exploration_* 工具并报告可追溯
      的运行记录。回答保持简洁客观。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell and filesystem ────────────────────────────────────────────────────
#
# Exploration data is often read from disk or listed before processing. Both
# shell tools consume the host registry from here; their executors are
# host-plane.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── the exploration engine's model-facing tools ─────────────────────────────
#
# The seven `exploration_*` tools (ingest/clean/convert/extract/detect/profile/run) call
# the engine's pure processors directly and accept an inline pipeline, so they
# need no engine service row in this preset.
- id: tool-exploration
  name: '@deepseek-ai/dsh-tool-exploration'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session, for fetching exploration data or specs.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000