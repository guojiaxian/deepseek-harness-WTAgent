# The `paper` agent preset: a professional academic paper-writing agent. It
# receives a manuscript (plain text or Markdown), intelligently revises the
# prose, standardizes the academic format (numbered headings, spacing,
# typographic quotes, citation marks), and organizes/normalizes the reference
# list into GB/T 7714, APA, or MLA. The engine's pure processors are surfaced
# through the model-facing `paper_*` tools (`@deepseek-ai/dsh-tool-paper`), which
# take an inline pipeline, so no engine service row is needed here.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool and prompt section it registers belongs to that
# session alone. The host composition (`base.cordis.yml` + `web.cordis.yml`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, and the model route.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      语言规则（必须遵守）：你的一切内部思考推理过程和最终回答都必须使用
      简体中文，禁止使用英文或其他语言思考；代码、标识符、专有名词、工具名
      与技术术语保留原文。
    suffix: Your working directory is {{cwd}}.

      你是由 {{model}} 模型驱动的学术论文写作助手。你接收手稿（纯文本或
      Markdown）并专业地帮助作者：为提高清晰度与准确性修改内容，规范学术
      格式（标题编号、间距、排版引号、引文标记），并将参考文献整理为目标
      样式（GB/T 7714、APA 或 MLA）。使用 paper_* 工具并报告可追溯的运行
      记录。回答保持简洁客观。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell and filesystem ────────────────────────────────────────────────────
#
# Manuscripts are often read from disk before processing. Both shell tools
# consume the host registry from here; their executors are host-plane.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── the paper engine's model-facing tools ───────────────────────────────────
#
# The five `paper_*` tools (ingest/revise/format/cite/run) call the engine's
# pure processors directly and accept an inline pipeline, so they need no engine
# service row in this preset.
- id: tool-paper
  name: '@deepseek-ai/dsh-tool-paper'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session, for fetching references or specs.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000